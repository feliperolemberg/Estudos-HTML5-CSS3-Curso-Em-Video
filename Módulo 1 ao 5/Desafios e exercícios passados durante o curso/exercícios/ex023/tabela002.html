<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      border-collapse: collapse;
      position: relative; 
      /* Configuração estilística necessária na tabela 
      para gerar cabeçalho fixo na rolagem */
      width: 500px;
    }

    caption {
      background-color: lightgray;
      font-size: 1.5em;
      font-weight: bold;
      padding: 10px;
    }

    thead, tfoot{
      background-color: gray;
      color: white;
    }

    thead > tr > th {
      background-color: gray;
      position: sticky;
      top: -1px;
    }

    tbody > tr:nth-child(odd) /*odd - ímpar or even - par*/ {
      background-color: lightgray;
    }

    th, td {
      border: 1px solid black;
      padding: 10px;
    }

    td.num {
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>Uso de tabelas grandes</h1>
  <!-- ANATOMIA PARA TABELAS GRANDES 
    TABLE
      CAPTION
      THEAD
        TR, TD, TH
      TBODY
        TR, TD, TH
      TFOOT
        TR, TD, TH
  -->
  <table>
    <caption>População das unidades federativas</caption>
    <thead>
      <tr>
        <th scope="col">Unidade Federativa</th>
        <th scope="col" style="width: 50px;">População</th>
      </tr>
    </thead>
    <tfoot>
      <tr>
        <th scope="row">Total de habitantes:</th>
        <td class="num"><strong>99.225.847</strong></td>
      </tr>
    </tfoot>
    <tbody>
      <tr>
        <td>São Paulo</td>
        <td class="num">45.919.049</td>
      </tr>
      <tr>
        <td>Minas Gerais</td>
        <td class="num">21.168.791</td>
      </tr>
      <tr>
        <td>Rio de Janeiro</td>
        <td class="num">17.264.943</td>
      </tr>
      <tr>
        <td>Bahia</td>
        <td class="num">14.873.064</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
